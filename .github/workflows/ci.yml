# Lint and test only. No AWS credentials, no plan, no apply: this runs on pull
# requests from anyone, so it must not be able to touch the account.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ruff check scripts/spot-prices scripts/check-quotas scripts/upload-model
      - run: uv run mypy worker/src client/src
      - run: uv run bandit -q -r worker/src client/src
      - run: uv run pytest -q --cov --cov-report=term --cov-fail-under=80

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform fmt -check -recursive
      - name: validate root
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: validate bootstrap
        working-directory: terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: tflint
        working-directory: terraform
        run: tflint --init && tflint --recursive

  packer-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.1"
      - name: packer fmt and validate
        working-directory: packer
        run: packer fmt -check -recursive . && packer init . && packer validate .
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files packer scripts | xargs grep -l '^#!.*\(bash\|sh\)' | xargs grep -L 'uv run')
          shellcheck -x -P SCRIPTDIR "${files[@]}"
