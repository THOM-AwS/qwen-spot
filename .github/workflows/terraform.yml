name: terraform

# plan: every push to any branch (and on demand), read-only role, no approval.
#   It never writes state (-lock=false) and prints only resource addresses.
# apply: on demand from main only (a deliberate workflow_dispatch, which needs
#   write access). The plan job runs first and writes its summary; the apply job
#   runs in the "aws" environment (main only; a required reviewer there is
#   optional), re-plans with the write role, and refuses to continue unless its
#   summary hash equals the plan's, so it never applies something unplanned.
on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        type: choice
        options: [plan, apply]
        default: plan
      refresh:
        description: >-
          Refresh state before planning. Turn off only to recover when the CI
          roles cannot read a resource (for example a bucket policy that denies
          them HeadBucket); it plans from state alone.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary_sha: ${{ steps.plan.outputs.summary_sha }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: qwen-spot-plan-${{ github.run_id }}

      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          if [ -z "$TFVARS" ]; then echo "::error::secret TFVARS is empty"; exit 1; fi
          umask 077
          printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
        run: >-
          ../.github/scripts/tf-quiet.sh init -input=false -no-color
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION"

      # Public repo: logs and artifacts are world-readable, so the plan file is
      # never uploaded and only resource addresses and actions are printed.
      - name: Plan
        id: plan
        env:
          # Pushes have no inputs: refresh is always on for them.
          REFRESH: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh }}
        run: |
          ../.github/scripts/tf-quiet.sh plan -input=false -no-color -lock=false -refresh="$REFRESH" -out=tfplan
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")) \(.address)"' | sort > plan-summary.txt
          sha=$(sha256sum plan-summary.txt | cut -d' ' -f1)
          echo "summary_sha=$sha" >> "$GITHUB_OUTPUT"
          cat plan-summary.txt
          {
            echo "### Plan ($(wc -l < plan-summary.txt) changes, summary sha256 \`${sha:0:12}\`)"
            echo '```'
            cat plan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets
        if: always()
        run: rm -f terraform.tfvars tfplan

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: qwen-spot-apply-${{ github.run_id }}

      - name: Write tfvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          if [ -z "$TFVARS" ]; then echo "::error::secret TFVARS is empty"; exit 1; fi
          umask 077
          printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
        run: >-
          ../.github/scripts/tf-quiet.sh init -input=false -no-color
          -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION"

      - name: Re-plan and compare with the approved plan
        env:
          APPROVED_SHA: ${{ needs.plan.outputs.summary_sha }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          ../.github/scripts/tf-quiet.sh plan -input=false -no-color -refresh="$REFRESH" -out=tfplan
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")) \(.address)"' | sort > plan-summary.txt
          sha=$(sha256sum plan-summary.txt | cut -d' ' -f1)
          if [ "$sha" != "$APPROVED_SHA" ]; then
            echo "::error::plan changed since it was approved; run plan again"
            cat plan-summary.txt
            exit 1
          fi

      - name: Apply
        run: ../.github/scripts/tf-quiet.sh apply -input=false -no-color tfplan && echo applied

      - name: Remove secrets
        if: always()
        run: rm -f terraform.tfvars tfplan
