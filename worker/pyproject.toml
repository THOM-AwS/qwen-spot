[project]
name = "qwen-worker"
version = "0.1.0"
description = "SQS worker that runs on the qwen-spot GPU instance and calls a local vLLM server"
requires-python = ">=3.12"
license = "0BSD"
dependencies = [
    "boto3>=1.40,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
qwen-worker = "qwen_worker.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_worker"]
